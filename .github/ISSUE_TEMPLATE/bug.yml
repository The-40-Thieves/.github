name: Bug report
description: Something behaves differently from what the docs or the code promise.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems do not belong here; use the private contact in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag, package version or commit you are running.
      placeholder: v0.13.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or inputs that shows the problem.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the exact output or error text.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version (Python, Node, Rust) and the MCP client, where relevant.
